[supervisord]
nodaemon=true
user=sandbox
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:vncserver]
command=/usr/bin/vncserver :1 -geometry 1280x800 -depth 24 -localhost yes -fg
user=sandbox
environment=HOME="/home/sandbox",USER="sandbox",DISPLAY=":1"
autorestart=true
stdout_logfile=/tmp/vnc.log
stderr_logfile=/tmp/vnc.err
